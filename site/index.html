<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 지방선거 — 후보자 데이터 트래커</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700;900&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
  :root {
    --bg: #f5f1ea; --bg-card: #fffdf8; --ink: #1a1a1a; --ink-sub: #555;
    --rule: #d8d2c8; --accent: #c41e3a;
    --serif: 'Noto Serif KR', serif;
    --sans: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--sans); background: var(--bg); color: var(--ink); line-height: 1.6; -webkit-font-smoothing: antialiased; min-height: 100vh; }
  .header { border-bottom: 3px double var(--ink); padding: 2.5rem 2rem 1.5rem; }
  .header-inner { max-width: 1400px; margin: 0 auto; display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 1.5rem; }
  .title { font-family: var(--serif); font-weight: 900; font-size: clamp(2rem, 5vw, 3.5rem); line-height: 1; letter-spacing: -0.02em; }
  .subtitle { font-family: var(--serif); font-style: italic; font-size: 1rem; color: var(--ink-sub); margin-top: 0.5rem; letter-spacing: 0.04em; }
  .dday { text-align: right; font-family: var(--serif); }
  .dday-label { font-size: 0.75rem; color: var(--ink-sub); letter-spacing: 0.15em; text-transform: uppercase; }
  .dday-number { font-size: clamp(2.5rem, 6vw, 4rem); font-weight: 900; line-height: 1; color: var(--accent); }
  .dday-date { font-size: 0.9rem; color: var(--ink-sub); margin-top: 0.25rem; }
  main { max-width: 1400px; margin: 0 auto; padding: 2rem 2rem 4rem; }
  .loading { padding: 4rem 0; text-align: center; color: var(--ink-sub); font-family: var(--serif); font-style: italic; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); margin-bottom: 3rem; }
  .stat { padding: 1.25rem 1.5rem; border-right: 1px solid var(--rule); }
  .stat:last-child { border-right: none; }
  .stat-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-sub); margin-bottom: 0.5rem; }
  .stat-value { font-family: var(--serif); font-size: 1.85rem; font-weight: 700; line-height: 1; }
  .stat-sub { font-size: 0.85rem; color: var(--ink-sub); margin-top: 0.25rem; }
  .section-title { font-family: var(--serif); font-weight: 700; font-size: 1.75rem; margin: 3rem 0 1.5rem; padding-bottom: 0.75rem; border-bottom: 2px solid var(--ink); }
  .section-hint { font-size: 0.9rem; color: var(--ink-sub); margin-top: -1rem; margin-bottom: 1.5rem; font-style: italic; }
  #map { height: 600px; border: 1px solid var(--rule); background: var(--bg-card); margin-bottom: 2.5rem; }
  .leaflet-container { background: var(--bg) !important; font-family: var(--sans) !important; }
  .sido-tooltip { background: var(--ink) !important; color: #fff !important; border: none !important; font-family: var(--serif) !important; font-weight: 700 !important; padding: 0.3rem 0.7rem !important; }
  .sido-tooltip::before { display: none !important; }
  .region-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; }
  .region { background: var(--bg-card); border: 1px solid var(--rule); padding: 1.25rem 1.5rem; transition: all 0.3s ease; scroll-margin-top: 100px; }
  .region.highlight { border-color: var(--accent); border-width: 2px; box-shadow: 0 4px 16px rgba(196,30,58,0.18); }
  .region-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 1rem; padding-bottom: 0.5rem; border-bottom: 1px solid var(--rule); }
  .region-name { font-family: var(--serif); font-weight: 700; font-size: 1.15rem; }
  .region-count { font-size: 0.85rem; color: var(--ink-sub); }
  .candidate { display: flex; align-items: center; gap: 0.75rem; padding: 0.5rem 0; border-bottom: 1px dotted var(--rule); }
  .candidate:last-child { border-bottom: none; }
  .candidate-color { width: 4px; height: 24px; flex-shrink: 0; }
  .candidate-name { font-weight: 500; flex: 1; }
  .candidate-party { font-size: 0.8rem; color: var(--ink-sub); }
  .sido-section { margin-bottom: 2rem; }
  .sido-section summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: baseline; padding: 0.6rem 0; border-bottom: 1px solid var(--ink); margin-bottom: 1.25rem; }
  .sido-section summary::-webkit-details-marker { display: none; }
  .sido-section summary::before { content: '▼'; font-size: 0.7em; margin-right: 0.6rem; color: var(--ink-sub); transition: transform 0.2s; }
  .sido-section:not([open]) summary::before { content: '▶'; }
  .sido-section summary:hover { color: var(--accent); }
  .sido-section-name { font-family: var(--serif); font-weight: 700; font-size: 1.3rem; }
  .sido-section-meta { font-size: 0.85rem; color: var(--ink-sub); }
  .basic-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1rem; }
  .basic-region { background: var(--bg-card); border: 1px solid var(--rule); padding: 0.9rem 1.1rem; }
  .basic-region-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 0.6rem; padding-bottom: 0.4rem; border-bottom: 1px dotted var(--rule); }
  .basic-region-name { font-family: var(--serif); font-weight: 700; font-size: 1rem; }
  footer { text-align: center; padding: 2rem; font-size: 0.85rem; color: var(--ink-sub); border-top: 1px solid var(--rule); }
  footer a { color: var(--accent); text-decoration: none; }
  footer a:hover { text-decoration: underline; }
</style>
</head>
<body>
<header class="header">
  <div class="header-inner">
    <div>
      <h1 class="title">2026 지방선거</h1>
      <p class="subtitle">제9회 전국동시지방선거 · 후보자 데이터 트래커</p>
    </div>
    <div class="dday">
      <div class="dday-label">D-DAY</div>
      <div class="dday-number" id="dday">—</div>
      <div class="dday-date">2026년 6월 3일</div>
    </div>
  </div>
</header>
<main>
  <div id="content" class="loading">데이터 불러오는 중…</div>
</main>
<footer>
  데이터 출처: <a href="https://www.data.go.kr" target="_blank" rel="noopener">공공데이터포털</a> 중앙선거관리위원회 OpenAPI ·
  마지막 갱신: <span id="last-updated">—</span>
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
const ELECTION_DATE = '2026-06-03T00:00:00';

function calculateDDay() {
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const electionDay = new Date(ELECTION_DATE);
  const diffDays = Math.ceil((electionDay - today) / (1000 * 60 * 60 * 24));
  const el = document.getElementById('dday');
  if (diffDays > 0) el.textContent = `D-${diffDays}`;
  else if (diffDays === 0) el.textContent = 'D-DAY';
  else el.textContent = `D+${-diffDays}`;
}

async function loadParties() {
  try {
    const resp = await fetch('data/parties.json');
    return resp.ok ? await resp.json() : {};
  } catch { return {}; }
}

async function loadGeo() {
  const resp = await fetch('assets/geo/sido.geojson');
  return resp.ok ? await resp.json() : null;
}

async function loadLatestPreliminary() {
  const today = new Date();
  for (let i = 0; i < 14; i++) {
    const d = new Date(today);
    d.setDate(d.getDate() - i);
    const yyyy = d.getFullYear();
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const dd = String(d.getDate()).padStart(2, '0');
    const dateStr = `${yyyy}${mm}${dd}`;
    try {
      const resp = await fetch(`../data/preliminary/20260603/snapshot_${dateStr}.json`);
      if (resp.ok) return { data: await resp.json(), dateStr };
    } catch {}
  }
  throw new Error('최근 14일 내 스냅샷 파일을 찾지 못했습니다.');
}

function scrollToSido(name) {
  const card = document.querySelector(`[data-sido="${CSS.escape(name)}"]`);
  if (card) {
    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
    document.querySelectorAll('.region.highlight').forEach(el => el.classList.remove('highlight'));
    card.classList.add('highlight');
    setTimeout(() => card.classList.remove('highlight'), 2500);
  }
}

function initMap(geo, bySido) {
  const map = L.map('map', {
    zoomControl: true,
    scrollWheelZoom: false,
    attributionControl: false,
  }).setView([36.0, 127.7], 7);

  const baseStyle = { fillColor: '#e8e0d0', weight: 1, color: '#999', fillOpacity: 0.55 };
  const hoverStyle = { fillColor: '#f4d35e', weight: 2, color: '#1a1a1a', fillOpacity: 0.75 };

  const layer = L.geoJSON(geo, {
    style: baseStyle,
    onEachFeature: (feature, layer) => {
      const name = feature.properties.name;
      let matched = bySido[name];
      if (!matched && (name === '광주광역시' || name === '전라남도')) {
        matched = bySido['전남광주통합특별시'];
      }
      const count = matched ? matched.length : 0;
      layer.bindTooltip(`${name} <span style="opacity:0.7">· ${count}명</span>`, {
        sticky: true, className: 'sido-tooltip', direction: 'top',
      });
      layer.on('mouseover', e => e.target.setStyle(hoverStyle));
      layer.on('mouseout', e => layer.resetStyle ? layer.resetStyle(e.target) : e.target.setStyle(baseStyle));
      layer.on('click', () => {
        let targetName = name;
        if (name === '광주광역시' || name === '전라남도') targetName = '전남광주통합특별시';
        scrollToSido(targetName);
      });
    },
  }).addTo(map);

  map.fitBounds(layer.getBounds(), { padding: [20, 20] });
}

function renderCandidateList(list, partyColor) {
  return list.map(c => `
    <div class="candidate">
      <div class="candidate-color" style="background:${partyColor(c.jdName)}"></div>
      <div class="candidate-name">${c.name}</div>
      <div class="candidate-party">${c.jdName}</div>
    </div>
  `).join('');
}

function render(data, parties, geo) {
  const cands = data.candidates;
  const byType = {};
  for (const c of cands) {
    const t = String(c.sgTypecode);
    byType[t] = (byType[t] || 0) + 1;
  }
  const totalParties = new Set(cands.map(c => c.jdName)).size;

  // 시도지사 (sgTypecode=3)
  const sidoCandidates = cands.filter(c => String(c.sgTypecode) === '3');
  const bySido = {};
  for (const c of sidoCandidates) {
    const region = c.sggName || c.sdName;
    if (!bySido[region]) bySido[region] = [];
    bySido[region].push(c);
  }

  // 기초단체장 (sgTypecode=4)
  const basicCandidates = cands.filter(c => String(c.sgTypecode) === '4');
  const basicBySido = {};
  for (const c of basicCandidates) {
    const sido = c.sdName;
    const sgg = c.sggName || c.wiwName;
    if (!basicBySido[sido]) basicBySido[sido] = {};
    if (!basicBySido[sido][sgg]) basicBySido[sido][sgg] = [];
    basicBySido[sido][sgg].push(c);
  }

  const partyColor = (name) => parties[name] || (name === '무소속' ? '#888' : '#bbb');
  const koSort = (a, b) => a.localeCompare(b, 'ko');
  const sortedSidoRegions = Object.keys(bySido).sort(koSort);
  const sortedBasicSidos = Object.keys(basicBySido).sort(koSort);

  let html = `
    <div class="stats">
      <div class="stat">
        <div class="stat-label">총 예비후보자</div>
        <div class="stat-value">${cands.length.toLocaleString()}명</div>
        <div class="stat-sub">${data.fetched_at.slice(0,10)} 기준</div>
      </div>
      <div class="stat">
        <div class="stat-label">시도지사 후보</div>
        <div class="stat-value">${(byType['3'] || 0).toLocaleString()}명</div>
        <div class="stat-sub">16개 광역단체 선거</div>
      </div>
      <div class="stat">
        <div class="stat-label">기초단체장 후보</div>
        <div class="stat-value">${(byType['4'] || 0).toLocaleString()}명</div>
        <div class="stat-sub">227개 시군구 선거</div>
      </div>
      <div class="stat">
        <div class="stat-label">참여 정당</div>
        <div class="stat-value">${totalParties}개</div>
        <div class="stat-sub">무소속 포함</div>
      </div>
    </div>

    <h2 class="section-title">시도지사 후보자</h2>
    <p class="section-hint">지도에서 시도를 클릭하면 해당 카드로 이동합니다.</p>
    <div id="map"></div>
    <div class="region-grid">
      ${sortedSidoRegions.map(region => {
        const list = bySido[region];
        return `
          <div class="region" data-sido="${region}">
            <div class="region-header">
              <div class="region-name">${region}</div>
              <div class="region-count">${list.length}명</div>
            </div>
            ${renderCandidateList(list, partyColor)}
          </div>`;
      }).join('')}
    </div>

    <h2 class="section-title">기초단체장 후보자</h2>
    <p class="section-hint">시·군·구청장 후보자. 시도 헤더를 클릭하면 접고 펼 수 있습니다.</p>
    ${sortedBasicSidos.map(sido => {
      const sggMap = basicBySido[sido];
      const sortedSggs = Object.keys(sggMap).sort(koSort);
      const total = Object.values(sggMap).reduce((s, arr) => s + arr.length, 0);
      return `
        <details class="sido-section" open>
          <summary>
            <span class="sido-section-name">${sido}</span>
            <span class="sido-section-meta">${sortedSggs.length}개 선거구 · ${total}명</span>
          </summary>
          <div class="basic-grid">
            ${sortedSggs.map(sgg => {
              const list = sggMap[sgg];
              return `
                <div class="basic-region">
                  <div class="basic-region-header">
                    <div class="basic-region-name">${sgg}</div>
                    <div class="region-count">${list.length}명</div>
                  </div>
                  ${renderCandidateList(list, partyColor)}
                </div>`;
            }).join('')}
          </div>
        </details>`;
    }).join('')}
  `;
  const content = document.getElementById('content');
  content.innerHTML = html;
  content.classList.remove('loading');

  if (geo) initMap(geo, bySido);
}

async function main() {
  calculateDDay();
  try {
    const [{ data, dateStr }, parties, geo] = await Promise.all([
      loadLatestPreliminary(),
      loadParties(),
      loadGeo(),
    ]);
    const dateFmt = `${dateStr.slice(0,4)}.${dateStr.slice(4,6)}.${dateStr.slice(6,8)}`;
    document.getElementById('last-updated').textContent = dateFmt;
    render(data, parties, geo);
  } catch (e) {
    document.getElementById('content').innerHTML =
      `<div class="loading">데이터 로딩 실패: ${e.message}</div>`;
  }
}

main();
</script>
</body>
</html>
