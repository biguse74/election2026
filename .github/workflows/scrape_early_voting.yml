name: 사전투표율 스크래핑 (info.nec.go.kr)

# 9회 지선 사전투표 KST 5/29 06:00 ~ 5/30 18:00. info.nec.go.kr VCAP01 직접 스크래핑.
#
# 운영 구조 (2026-05-30 변경):
#   GitHub 예약(schedule) cron이 이 저장소에서 거의/전혀 발화하지 않음.
#   → 외부 cron(cron-job.org)이 workflow_dispatch를 5분마다 호출하는 것을 주(主) 트리거로.
#   schedule은 백업으로만 남기되 정각·혼잡 시각을 피해 :07,:17,:27,:37,:47,:57.
#
#   한 dispatch = 단발 실행(스크랩 1회). 스크래퍼 자체가 07시~현재 전 시각을
#   한 번에 자가치유 수집하므로 단발로도 누락분을 메운다. 외부 cron 5분 주기가 재시도 담당.
on:
  workflow_dispatch:        # 주 트리거 — 외부 cron이 5분마다 호출
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'   # 백업, 정각/혼잡 회피 (10분 간격)

concurrency:
  group: early-voting-scrape
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write

    steps:
      - name: 레포 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.12 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 의존성 설치
        run: pip install requests

      # 단발 실행: 스크랩 1회 → 새 데이터 있으면 1커밋 → push.
      #   스크래퍼는 idempotent(새 데이터 없으면 파일 미작성) → 변경 없으면 커밋 생략.
      #   push reject 시 pull --rebase로 재정렬(이 저장소 데이터는 append-only/단조).
      #   rebase가 충돌하면 abort하고 종료 → 다음 dispatch(5분 내)가 새 체크아웃으로 재시도.
      #   ※ git reset --hard / git clean / 데이터 삭제는 사용하지 않음.
      - name: 수집·커밋·푸시 (단발)
        run: |
          set -e
          python scripts/scrape_early_voting.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/early_voting/
          if git diff --staged --quiet; then
            echo "변경 없음 (발표 전·중복·원격 최신) → 커밋 생략"
            exit 0
          fi
          STAMP=$(TZ=Asia/Seoul date +%Y-%m-%d-%H%M)
          git commit -m "data: 사전투표율 스크래핑 KST $STAMP"
          for attempt in 1 2 3; do
            if git push; then
              echo "push 성공 (시도 $attempt)"; exit 0
            fi
            echo "push reject — pull --rebase 후 재시도 ($attempt/3)"
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              echo "rebase 충돌 → 다음 dispatch에 위임"; exit 1
            fi
          done
          echo "push 3회 실패 → 다음 dispatch에 위임"; exit 1
