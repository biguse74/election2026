name: 사전투표율 스크래핑 (info.nec.go.kr)

# 9회 지선 사전투표는 KST 5/29 06:00 ~ 5/30 18:00.
# OpenAPI(ErVotingSttusInfoInqireService)는 실시간 미제공 → info.nec.go.kr
# VCAP01 페이지의 POST endpoint를 직접 스크래핑한다. 인증 불필요.
#
# NEC가 매 정시(09:00, 10:00…)에 새 시간대 통계를 발표.
#
# cron은 :00/:30 같은 정각을 피한다 — GitHub Actions 스케줄러는 정각·30분에
# 예약이 폭주해 그 시각 작업이 자주 15~45분 지연되거나 통째로 누락된다.
# off-peak 분(:x3)에 10분 간격으로 걸어 시간당 6회 시도 → 일부가 드롭돼도
# 매 정시 발표분을 몇 분 안에 잡는다. 중복 시각은 스크립트가 dedupe·commit skip.
on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:

concurrency:
  group: scrape-early-voting
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 레포 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.12 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 의존성 설치
        run: pip install requests

      # 수집·커밋·푸시를 한 스텝에서 'rebase-free'로 — 작업 스케줄러 등 다른 곳과
      # 동시에 푸시해도 충돌하지 않게. 매 시도마다 원격에 hard 정렬 후 재수집·재커밋.
      - name: 수집·커밋·푸시 (rebase-free)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/scrape_early_voting.py
            git add data/early_voting/
            if git diff --staged --quiet; then
              echo "변경 없음 (발표 전·중복·원격 최신) → 커밋 생략"; exit 0
            fi
            STAMP=$(TZ=Asia/Seoul date +%Y-%m-%d-%H%M)
            git commit -m "data: 사전투표율 스크래핑 KST $STAMP"
            if git push; then echo "push 성공 (시도 $attempt)"; exit 0; fi
            echo "push reject — 원격 재정렬 후 재시도 ($attempt/3)"
          done
          echo "push 3회 실패"; exit 1
