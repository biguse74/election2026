name: 사전투표율 스크래핑 (info.nec.go.kr)

# 9회 지선 사전투표 KST 5/29 06:00 ~ 5/30 18:00. info.nec.go.kr VCAP01 직접 스크래핑.
#
# 핵심: GitHub 스케줄러가 이 저장소 예약을 대부분 드롭한다. 그래서 cron 한 번에
# 의존하지 않고, "한 번 떠도 그 안에서 ~32분간 4분 간격 반복 수집(self-loop)"한다.
# 30분마다 스타거드로 예약(:09, :39)하고, 새 run이 뜨면 이전 run을 취소(cancel-in-progress)
# → 시간당 한두 번만 발화해도 사실상 연속 커버. PC·토큰·외부서비스 불필요.
on:
  schedule:
    - cron: '9,39 * * * *'   # 30분 간격, :00/:30 혼잡 회피
  workflow_dispatch:

concurrency:
  group: scrape-early-voting
  cancel-in-progress: true   # 새 run이 뜨면 진행중 루프를 교체

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 40       # self-loop 안전 상한
    permissions:
      contents: write

    steps:
      - name: 레포 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.12 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 의존성 설치
        run: pip install requests

      # 한 run 안에서 ~32분간 4분 간격으로 반복 수집·커밋·푸시 (rebase-free).
      # 매 시도마다 원격 hard 정렬 후 재수집 → 작업 스케줄러 등과 동시에 돌아도 충돌 없음.
      - name: 수집 루프 (~32분, 4분 간격)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for i in $(seq 1 8); do
            for attempt in 1 2 3; do
              git fetch origin main
              git reset --hard origin/main
              python scripts/scrape_early_voting.py
              git add data/early_voting/
              if git diff --staged --quiet; then
                echo "[$i] 변경 없음 (발표 전·중복·원격 최신)"; break
              fi
              STAMP=$(TZ=Asia/Seoul date +%Y-%m-%d-%H%M)
              git commit -m "data: 사전투표율 스크래핑 KST $STAMP"
              if git push; then echo "[$i] push 성공"; break; fi
              echo "[$i] push reject — 재정렬 후 재시도 ($attempt/3)"
            done
            if [ "$i" -lt 8 ]; then sleep 240; fi
          done
