name: 라이브 투개표 자동 수집

# 공공데이터포털 일 호출 한도 1만/일. 한 번 수집 = 투표율 1콜 + 개표 51콜 = 52콜.
# 시간대별로 빈도를 달리해 6/3 + 6/4 보조까지 약 5,500콜로 완주 (마진 45%).
#
# 모드별 호출량:
#   turnout-only  =  1콜/회 (개표는 ERROR-03)
#   full          = 52콜/회
#   dry-run       =  0콜 (저장 생략)
#
# 시간대 분기 (KST):
#   06:00~17:50  본투표 시간      turnout-only · 5분 간격  (1콜  × 144회 =   144)
#   18:00~20:55  격렬 개표 초반   full         · 5분 간격  (52콜 ×  36회 = 1,872)
#   21:00~5:55   정리 개표        full         · 10분 간격 (52콜 ×  54회 = 2,808)
#   6/4 06:00~11:55  익일 보조    full         · 30분 간격 (52콜 ×  12회 =   624)
#   합계 약 5,448콜 — 마진 45%.  익일 보조는 6/3 24시까지 미완료 케이스 대비.
#
# 5/22~6/2 매일 KST 18:00 dry-run 정찰 (OpenAPI 응답 스키마 확인용).
#
# GitHub Actions cron은 UTC.  KST = UTC + 9.
#   KST 06:00 = UTC 21:00 (전날)
#   KST 18:00 = UTC 09:00
#   KST 21:00 = UTC 12:00
#   KST 익일 06:00 = UTC 21:00 (같은 UTC 날짜의 21시)
#   KST 익일 12:00 = UTC 03:00 (다음 UTC 날짜의 03시)

on:
  schedule:
    # 정찰: 5/22~5/31 매일 KST 18:00 (UTC 09:00) → dry-run
    - cron: '0 9 22-31 5 *'
    # 정찰: 6/1~6/2 매일 KST 18:00
    - cron: '0 9 1-2 6 *'

    # 본투표 시간대 (6/3 KST 06:00~17:55) — 투표율만, 5분 간격
    - cron: '*/5 21-23 2 6 *'    # KST 6/3 06:00~08:55 (UTC 6/2 21:00~23:55)
    - cron: '*/5 0-8 3 6 *'      # KST 6/3 09:00~17:55 (UTC 6/3 00:00~08:55)

    # 격렬 개표 초반 (6/3 KST 18:00~20:55) — 풀 호출, 5분 간격
    - cron: '*/5 9-11 3 6 *'     # UTC 6/3 09:00~11:55  =  KST 6/3 18:00~20:55

    # 정리 개표 (6/3 KST 21:00 ~ 6/4 KST 05:55) — 풀 호출, 10분 간격
    - cron: '*/10 12-20 3 6 *'   # UTC 6/3 12:00~20:55  =  KST 6/3 21:00 ~ 6/4 05:55

    # 익일 보조 (6/4 KST 06:00 ~ 11:55) — 풀 호출, 30분 간격
    - cron: '*/30 21-23 3 6 *'   # UTC 6/3 21:00~23:30  =  KST 6/4 06:00~08:30
    - cron: '*/30 0-2 4 6 *'     # UTC 6/4 00:00~02:30  =  KST 6/4 09:00~11:30

  workflow_dispatch:
    inputs:
      mode:
        description: '실행 모드 (auto는 현재 KST 시각으로 자동 분기)'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - dry-run
          - turnout-only
          - full
      sg-id:
        description: '선거 ID (기본 20260603 · 시뮬레이션 20220601)'
        required: false
        default: '20260603'

# 수집이 겹치지 않게 직렬화. 진행 중인 push가 있으면 다음 cron은 대기.
concurrency:
  group: fetch-live-counting
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: 레포 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.12 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 실행 모드 결정
        id: mode
        env:
          INPUT_MODE: ${{ github.event.inputs.mode || 'auto' }}
        run: |
          set -euo pipefail
          kst_date=$(TZ=Asia/Seoul date +%Y%m%d)
          kst_hhmm=$(TZ=Asia/Seoul date +%H%M)
          kst_full="${kst_date}${kst_hhmm}"
          echo "현재 KST: ${kst_date} ${kst_hhmm}"

          mode="$INPUT_MODE"
          if [ "$mode" = "auto" ]; then
            if   [ "$kst_full" -lt "202606030600" ]; then mode="dry-run"
            elif [ "$kst_full" -lt "202606031800" ]; then mode="turnout-only"
            elif [ "$kst_full" -lt "202606041200" ]; then mode="full"
            else                                          mode="skip"
            fi
          fi

          echo "실행 모드: $mode"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: 데이터 수집 실행
        if: steps.mode.outputs.mode != 'skip'
        env:
          NEC_API_KEY: ${{ secrets.NEC_API_KEY }}
          MODE: ${{ steps.mode.outputs.mode }}
          SG_ID: ${{ github.event.inputs.sg-id || '20260603' }}
        run: |
          set -euo pipefail
          args="--sg-id $SG_ID"
          case "$MODE" in
            dry-run)      args="$args --dry-run" ;;
            turnout-only) args="$args --skip-counting" ;;
            full)         ;;
            *) echo "알 수 없는 모드: $MODE"; exit 1 ;;
          esac
          echo "$ python scripts/fetch_live_counting.py $args"
          python scripts/fetch_live_counting.py $args

      - name: 변경사항 커밋·푸시
        if: steps.mode.outputs.mode != 'skip' && steps.mode.outputs.mode != 'dry-run'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/live_counting/
          if git diff --staged --quiet; then
            echo "변경사항 없음 (커밋 생략)"
            exit 0
          fi
          git commit -m "data: 라이브 수집 $(TZ=Asia/Seoul date +%Y-%m-%d-%H%M)"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "push reject — pull --rebase 후 재시도 ($attempt/3)"
            git pull --rebase origin "$(git rev-parse --abbrev-ref HEAD)"
          done
          echo "push 3회 실패"; exit 1
