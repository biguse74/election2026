name: 사전투표 현황 수집

# 9회 지선 사전투표일은 2026-05-29(금) ~ 2026-05-30(토), KST 06:00~18:00.
# 수집 정책:
#   - 사전투표 기간(5/29, 5/30) KST 06:00 ~ 19:00: 30분 간격 자동 수집
#   - 본투표일 전날(6/2)·기타 일자: 새벽 1회만 (혹시 누락분 보강)
# 스크립트는 데이터가 없으면 스냅샷을 저장하지 않으므로 idempotent.

on:
  schedule:
    # 매 30분 무조건 실행. 사전투표 기간(5/29~5/30) 외에는 API가 빈 응답을
    # 주므로 스크립트가 알아서 commit skip — 일 호출량은 약 96콜로 한도(1만)
    # 대비 무시할 수준.
    #
    # 시·일·월을 동시에 제약하는 cron(*/30 21-23 28-29 5 *)을 시도했으나
    # GitHub Actions가 새 schedule을 인식하지 못해 사전투표 첫날 06~08시에
    # 단 한 번도 트리거되지 않았다(5/29 KST 침묵). 안전하게 단순 표현으로.
    - cron: '*/30 * * * *'
  workflow_dispatch:

# 동시 실행 방지 — 같은 시각에 두 cron이 겹쳐도 큐잉.
concurrency:
  group: fetch-early-voting
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 레포 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.12 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 사전투표 수집
        env:
          NEC_API_KEY: ${{ secrets.NEC_API_KEY }}
        run: python scripts/fetch_early_voting.py

      - name: 변경사항 커밋·푸시
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/early_voting/
          if git diff --staged --quiet; then
            echo "변경사항 없음 (사전투표 시작 전·데이터 미공개) → 커밋 생략"
            exit 0
          fi
          STAMP=$(TZ=Asia/Seoul date +%Y-%m-%d-%H%M)
          git commit -m "data: 사전투표 스냅샷 KST $STAMP"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "push reject — pull --rebase 후 재시도 ($attempt/3)"
            git pull --rebase origin main
          done
          echo "push 3회 실패"; exit 1
