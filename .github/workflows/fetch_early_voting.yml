name: 사전투표 현황 수집

# 9회 지선 사전투표일은 2026-05-29(금) ~ 2026-05-30(토), KST 06:00~18:00.
# 폴링 정책:
#   - 사전투표 기간(5/29, 5/30) KST 06:00 ~ 19:00: 30분 간격 폴링
#   - 본투표일 전날(6/2)·기타 일자: 새벽 1회만 (혹시 누락분 보강)
# 스크립트는 데이터가 없으면 스냅샷을 저장하지 않으므로 idempotent.

on:
  schedule:
    # 1) 사전투표 1·2일차 (5/29 ~ 5/30) — KST 06~19시, 30분 간격
    #    cron은 UTC. KST 06:00 = UTC 21:00 (전날). 30분 간격이면 21:00, 21:30, …
    #    UTC 21:00~23:30 = 전날(5/28, 5/29) 21·22·23시
    #    UTC 00:00~09:30 = 당일(5/29, 5/30) 00~09시 → KST 09~18시
    #    KST 06~19시를 모두 커버: UTC 21~23시(전날) + UTC 00~10시(당일)
    - cron: '*/30 21-23 28-29 5 *'   # KST 5/29 06:00~08:30, 5/30 06:00~08:30
    - cron: '*/30 0-10 29-30 5 *'    # KST 5/29 09:00~19:30, 5/30 09:00~19:30
    # 2) 새벽 보강 (사전투표 마감 후 최종 보정, 본투표 전날까지)
    - cron: '45 18 * * *'            # 매일 KST 03:45
  workflow_dispatch:

# 동시 실행 방지 — 같은 시각에 두 cron이 겹쳐도 큐잉.
concurrency:
  group: fetch-early-voting
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 레포 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.12 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 사전투표 수집
        env:
          NEC_API_KEY: ${{ secrets.NEC_API_KEY }}
        run: python scripts/fetch_early_voting.py

      - name: 변경사항 커밋·푸시
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/early_voting/
          if git diff --staged --quiet; then
            echo "변경사항 없음 (사전투표 시작 전·데이터 미공개) → 커밋 생략"
            exit 0
          fi
          STAMP=$(TZ=Asia/Seoul date +%Y-%m-%d-%H%M)
          git commit -m "data: 사전투표 스냅샷 KST $STAMP"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "push reject — pull --rebase 후 재시도 ($attempt/3)"
            git pull --rebase origin main
          done
          echo "push 3회 실패"; exit 1
