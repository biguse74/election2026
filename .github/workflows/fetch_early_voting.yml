name: 사전투표 현황 수집

# 사전투표일(5/29~5/30)부터 선거 전날(6/2)까지만 활성화.
# 그 외 일자는 빈 응답이 반환되므로 스크립트 자체에서 스냅샷을 저장하지 않는다.
# 운영 단순화를 위해 매일 KST 03:45(UTC 18:45)에 한 번씩 시도 + 사전투표 기간엔
# 진행 상황 추적용으로 두 시간 간격 추가 폴링.

on:
  schedule:
    # 매일 KST 03:45 (UTC 전날 18:45) — 다른 fetcher와 같은 새벽 시간대
    - cron: '45 18 * * *'
    # 사전투표 기간(5/29, 5/30) 진행률 추적: 매 2시간(KST 10·12·14·16·18)
    - cron: '0 1,3,5,7,9 29-30 5 *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 레포 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.12 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 사전투표 수집
        env:
          NEC_API_KEY: ${{ secrets.NEC_API_KEY }}
        run: python scripts/fetch_early_voting.py

      - name: 변경사항 커밋·푸시
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          if git diff --staged --quiet; then
            echo "변경사항 없음 (커밋 생략)"
            exit 0
          fi
          git commit -m "data: 사전투표 스냅샷 $(date -u +%Y-%m-%d-%H%M)"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "push reject — pull --rebase 후 재시도 ($attempt/3)"
            git pull --rebase origin main
          done
          echo "push 3회 실패"; exit 1
