name: og:image PNG 빌드 (수동 폴백)

# assets/og.svg → assets/og.png 변환 (rsvg). 한국어 폰트는 fonts-noto-cjk.
#
# 운영 기본: og.png / og-sim.png / og-early-voting.png 는 로컬에서
# scripts/build_og_images.py · build_og_early_voting.py (Pillow + Noto KR)로
# 생성해 직접 커밋한다. 미리보기·폰트 충실도가 좋다.
# 이 워크플로우는 그 PNG를 자동으로 덮어쓰지 않도록 push 트리거를 제거하고
# 수동(workflow_dispatch) 폴백으로만 남긴다. (rsvg 렌더가 필요할 때만 실행)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 레포 체크아웃
        uses: actions/checkout@v4

      - name: librsvg + 한국어 폰트 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin fonts-noto-cjk
          fc-cache -fv

      - name: SVG → PNG 변환 (1200x630)
        run: rsvg-convert -w 1200 -h 630 assets/og.svg -o assets/og.png

      - name: 결과 확인
        run: |
          ls -la assets/og.png
          file assets/og.png

      - name: PNG 커밋·푸시
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/og.png
          if git diff --staged --quiet; then
            echo "변경사항 없음 (커밋 생략)"
            exit 0
          fi
          git commit -m "build: assets/og.png 갱신 (rsvg-convert)"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase origin main
          done
          exit 1
